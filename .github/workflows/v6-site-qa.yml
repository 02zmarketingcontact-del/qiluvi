name: QILUVI V6 static website QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'scripts/check-v6-site.cjs'
      - '.github/workflows/v6-site-qa.yml'
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'scripts/check-v6-site.cjs'
      - '.github/workflows/v6-site-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML routes, links, language alternates and assets
        run: node scripts/check-v6-site.cjs
