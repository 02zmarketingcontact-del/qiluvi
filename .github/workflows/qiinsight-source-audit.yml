name: QiInsight Source Audit Pilot
on:
  push:
    branches: [main]
    paths:
      - 'data/qiinsight/sources.json'
      - 'scripts/check-qiinsight-sources.cjs'
      - 'scripts/qiinsight-source-audit.cjs'
      - '.github/workflows/qiinsight-source-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source registry
        run: node scripts/check-qiinsight-sources.cjs
      - name: Probe all registered source homepages for connectivity and feed discovery
        env:
          QIINSIGHT_LIMIT: '500'
        run: node scripts/qiinsight-source-audit.cjs
      - name: Upload audit artifact (no auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: qiinsight-source-audit
          path: data/qiinsight/source-audit-latest.json
          retention-days: 14
